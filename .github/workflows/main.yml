name: Build App
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Usar chave fixa de assinatura (SHA-1 sempre igual)
        run: |
          if [ ! -f debug.keystore ]; then
            echo "::error::Falta o ficheiro debug.keystore na pasta principal do repositorio"
            exit 1
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1|SHA256"

      - name: Criar pasta www e copiar index
        run: mkdir -p www && cp index.html www/

      - name: Instalar Capacitor, Android e login Google
        run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-firebase/authentication@7 --legacy-peer-deps

      - name: Configurar Capacitor (appId e login Google)
        run: |
          node -e '
          const fs = require("fs");
          const f = "capacitor.config.json";
          let c = { appName: "Pobreflix", webDir: "www" };
          if (fs.existsSync(f)) c = JSON.parse(fs.readFileSync(f, "utf8"));
          c.appId = "com.pobreflix.app";
          c.webDir = c.webDir || "www";
          c.plugins = c.plugins || {};
          c.plugins.FirebaseAuthentication = { skipNativeAuth: true, providers: ["google.com"] };
          fs.writeFileSync(f, JSON.stringify(c, null, 2));
          '

      - name: Adicionar Android
        run: npx cap add android

      - name: Copiar google-services.json
        run: |
          if [ ! -f google-services.json ]; then
            echo "::error::Falta o ficheiro google-services.json na pasta principal do repositorio"
            exit 1
          fi
          cp google-services.json android/app/google-services.json

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar APK
        run: |
          cd android
          echo "android.enableJetifier=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          cat << 'EOF' >> app/build.gradle

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
